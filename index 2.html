<html lang="ru">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>ПОМЕХИ</title>
<style>
:root{--bg:#000;--fg:#fff;--neon:#37FF08;--ink:#000;--dim:#8f8f8f;--soft:#cfcfcf;--line:#2b2b2b;--f:Arial,"Helvetica Neue",Helvetica,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font-family:var(--f);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
.wrap{max-width:660px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:max(22px,env(safe-area-inset-top,0px)) max(56px,env(safe-area-inset-bottom,0px))}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--neon);outline-offset:3px}
a{color:var(--fg)}
p{margin:0}
h1,h2,h3{margin:0;font-weight:700;line-height:1;text-wrap:balance}
h1{font-size:clamp(52px,16vw,96px);letter-spacing:-.04em}
h2{font-size:clamp(28px,8vw,40px);letter-spacing:-.03em;text-transform:uppercase}
h3{font-size:17px;letter-spacing:-.01em}
.lab{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.neon{color:var(--neon)}
.dim{color:var(--dim)}
.soft{color:var(--soft)}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.back{font-size:14px;color:var(--dim);padding:8px 0;margin-bottom:18px;display:inline-block}
.back:hover{color:var(--fg)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:11px 18px;border:2px solid var(--fg);font-weight:700;font-size:14px;letter-spacing:.06em;text-transform:uppercase;text-align:center}
.btn:hover{background:var(--fg);color:var(--ink)}
.btn.go{background:var(--neon);border-color:var(--neon);color:var(--ink)}
.btn.go:hover{background:var(--fg);border-color:var(--fg)}
.btn.thin{border-color:var(--line);color:var(--dim)}
.btn.thin:hover{background:none;border-color:var(--fg);color:var(--fg)}
.btn[disabled]{opacity:.3;pointer-events:none}
.big{display:block;width:100%;border:2px solid var(--neon);padding:18px;margin-top:4px}
.big b{display:block;font-size:20px;text-transform:uppercase;letter-spacing:-.01em;color:var(--neon)}
.big span{display:block;font-size:14px;color:var(--soft);margin-top:4px}
.big:hover{background:var(--neon)}
.big:hover b,.big:hover span{color:var(--ink)}
@media (prefers-reduced-motion:no-preference){
.gl{position:relative;display:inline-block}
.gl::after{content:attr(data-t);position:absolute;left:0;top:0;color:var(--neon);clip-path:inset(0 0 100% 0);animation:gl 7s infinite steps(1);pointer-events:none}
@keyframes gl{0%,90%{clip-path:inset(0 0 100% 0);transform:none}91%{clip-path:inset(15% 0 60% 0);transform:translateX(4px)}93%{clip-path:inset(62% 0 10% 0);transform:translateX(-4px)}95%{clip-path:inset(0 0 100% 0)}}
}
.hero{display:flex;flex-direction:column;gap:16px;padding-bottom:24px;border-bottom:2px solid var(--line);margin-bottom:8px}
.pct{font-size:clamp(64px,20vw,120px);font-weight:700;line-height:.85;letter-spacing:-.05em;font-variant-numeric:tabular-nums}
.pct small{font-size:.38em;letter-spacing:0}
.sec{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;width:100%;padding:16px 0;border-bottom:1px solid var(--line)}
.sec b{display:block;font-size:17px;text-transform:uppercase;letter-spacing:-.01em}
.sec span{display:block;font-size:14px;color:var(--dim);margin-top:2px}
.sec:hover b{color:var(--neon)}
.sec .p{font-size:15px;font-variant-numeric:tabular-nums;text-align:right;min-width:52px}
.bars{display:flex;gap:3px;align-items:flex-end;justify-content:flex-end;height:18px;margin-bottom:4px}
.bars i{width:5px;background:var(--line)}
.bars i.on{background:var(--neon)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}
.tile{border:2px solid var(--line);padding:16px;display:flex;flex-direction:column;gap:6px}
.tile b{font-size:15px;text-transform:uppercase;letter-spacing:.01em}
.tile span{font-size:13.5px;color:var(--dim);line-height:1.4}
.tile:hover{border-color:var(--fg)}
.step{display:grid;grid-template-columns:44px 1fr;gap:14px;border:2px solid var(--line);padding:16px;width:100%}
.step:hover{border-color:var(--fg)}
.step .n{font-size:34px;font-weight:700;line-height:.9;color:var(--neon)}
.step b{display:block;font-size:17px;text-transform:uppercase}
.step span{display:block;font-size:14px;color:var(--soft);margin-top:3px}
.step em{display:block;font-style:normal;font-size:12px;color:var(--dim);margin-top:6px;letter-spacing:.06em;text-transform:uppercase}
.foot{margin-top:40px;font-size:12px;letter-spacing:.3em;color:#555}
.warn{border-left:3px solid var(--neon);padding:6px 0 6px 12px;font-size:14px;color:var(--soft)}
.sbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px}
.sbar .back{margin:0}
.log{display:flex;flex-direction:column}
.entry{padding:22px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.meta{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.meta .r{color:var(--fg)}
.ctx{font-size:15px;color:var(--soft);line-height:1.45}
.line{font-size:clamp(19px,5.2vw,23px);font-weight:700;line-height:1.5;letter-spacing:-.01em}
.line .bd{color:var(--neon)}
.line .g,.noise .g{color:var(--dim);font-weight:400}
.gapin{font:inherit;font-weight:700;color:var(--neon);background:transparent;border:0;border-bottom:2px solid var(--neon);border-radius:0;padding:0 2px;min-width:5ch;max-width:100%;caret-color:var(--neon)}
.gapin::placeholder{color:#3d3d3d}
.wide{width:100%;font-size:19px;padding:8px 2px}
.dial{display:inline;font:inherit;font-weight:700;color:var(--neon);border-bottom:2px dashed var(--neon);padding:0 2px}
.dial .k{font-weight:400;font-size:.6em;color:var(--dim);vertical-align:.25em;margin-left:4px}
.dial.solo{display:inline-block;margin-top:2px}
.ok{color:var(--neon)}
.no{color:var(--dim);text-decoration:line-through;font-weight:400}
.ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.go2{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;border:2px solid var(--fg);padding:9px 14px}
.go2:hover{background:var(--fg);color:var(--ink)}
.go2[disabled]{opacity:.3;pointer-events:none}
.mini{font-size:13px;color:var(--dim);text-decoration:underline;text-underline-offset:3px;padding:9px 4px}
.hint{font-size:17px;letter-spacing:.06em;color:var(--soft)}
.noise{font-size:clamp(17px,4.6vw,20px);letter-spacing:.05em;line-height:1.7;word-spacing:.2em}
.noise .w{color:var(--fg)}
.res{display:flex;flex-direction:column;gap:5px;font-size:15px;line-height:1.45}
.res .tr{color:var(--soft)}
.res .why{color:var(--dim)}
.res .tag{color:var(--neon);font-weight:700;text-transform:uppercase;font-size:13px;letter-spacing:.06em}
.cuts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cut{border:2px solid var(--line);padding:10px;display:flex;flex-direction:column;gap:6px}
.cut:hover{border-color:var(--fg)}
.cut span{font-size:12.5px;color:var(--soft);line-height:1.3}
.cut.right{border-color:var(--neon)}
.cut.off{opacity:.3}
.cut.pick{border-color:var(--fg)}
svg.tl{width:100%;height:auto;display:block}
.tl .trk{stroke:var(--line);stroke-width:1}
.tl .clip{fill:var(--fg)}
.tl .ph{stroke:var(--neon);stroke-width:2}
.tl .phl{fill:var(--neon);font-family:var(--f);font-size:8px;font-weight:700}
.tl .lbl{fill:var(--dim);font-family:var(--f);font-size:7px}
.tl .num{fill:var(--ink);font-family:var(--f);font-size:8px;font-weight:700}
.tl .dot{fill:var(--neon)}
.sum{padding:26px 0;display:flex;flex-direction:column;gap:14px}
.noisebox{position:relative;border:2px solid var(--fg);aspect-ratio:3/1;max-width:100%;overflow:hidden;display:flex;align-items:center;justify-content:center;margin-bottom:6px}
.noisebox canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
.noisebox b{position:relative;font-size:clamp(28px,9vw,48px);letter-spacing:-.02em;mix-blend-mode:difference}
.map{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.map i{aspect-ratio:1;background:var(--neon)}
.map i.n{background:repeating-linear-gradient(45deg,var(--fg) 0 2px,var(--bg) 2px 4px)}
.card{border-top:1px solid var(--line);padding:16px 0;display:flex;flex-direction:column;gap:6px}
.card .en{font-size:19px;font-weight:700}
.card .en[data-hide]{cursor:pointer}
.card .ru{font-size:15px;color:var(--soft)}
.card .ex{font-size:14px;color:var(--dim);font-style:italic}
.form{font-size:15px;font-weight:700;color:var(--neon)}
.kv{display:grid;grid-template-columns:96px 1fr;gap:5px 12px;font-size:14.5px}
.kv dt{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);padding-top:3px}
.kv dd{margin:0;min-width:0}
.sw{display:flex;border:2px solid var(--line);align-self:flex-start}
.sw button{padding:9px 13px;font-size:13px;color:var(--dim)}
.sw button.on{background:var(--fg);color:var(--ink)}
.jing{border:2px solid var(--neon);padding:18px;display:flex;flex-direction:column;gap:12px}
.jl{font-size:16px;line-height:1.7}
.kw{border-bottom:2px solid var(--neon);cursor:pointer;font-weight:700}
.kw.open{color:var(--neon)}
.lv{display:flex;gap:4px}
.lv i{width:22px;height:6px;background:var(--line)}
.lv i.on{background:var(--neon)}
.wf{width:100%;border-collapse:collapse;font-size:15px}
.wf td{padding:11px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.wf td:first-child{color:var(--dim);font-size:13px;letter-spacing:.06em;white-space:nowrap}
.wf .w{font-weight:700;font-size:17px}
.wf .s{color:var(--neon)}
.timer{font-size:clamp(110px,34vw,190px);font-weight:700;line-height:.85;letter-spacing:-.06em;font-variant-numeric:tabular-nums}
.rounds{display:flex;gap:8px}
.rounds span{font-size:13px;font-weight:700;border:2px solid var(--line);padding:6px 10px;color:var(--dim)}
.rounds span.on{border-color:var(--neon);color:var(--neon)}
.rounds span.done{background:var(--fg);border-color:var(--fg);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:14px;border:2px solid var(--line);padding:7px 10px}
.chip.on{border-color:var(--neon);color:var(--neon)}
textarea.code{width:100%;min-height:96px;background:transparent;color:var(--fg);border:2px solid var(--line);border-radius:0;padding:10px;font:13px/1.4 var(--f);word-break:break-all;resize:vertical}
.list{display:flex;flex-direction:column}
.list > div{padding:14px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:3px}
.list b{font-size:15px;text-transform:uppercase}
.list span{font-size:14.5px;color:var(--soft)}
.list em{font-style:normal;font-size:12px;color:var(--dim)}
.src{font-size:13px;line-height:1.8;color:var(--dim);padding-left:18px;margin:0}
.src a{color:var(--dim)}
@media (max-width:430px){.grid2,.cuts{grid-template-columns:1fr}.kv{grid-template-columns:1fr}.kv dt{padding-top:6px}}
</style>
</head>

{id:"c1",w:"c",t:"type",src:1,bank:"c",q:"The best way to ___ a person who doesn't use social media is to call him.",a:["track down"],h:"track down",ru:"Лучший способ разыскать человека без соцсетей — позвонить ему.",x:"Track down = to find, разыскать."},
{id:"c2",w:"c",t:"type",src:1,bank:"c",q:"I like to ___ what my friends are doing by using social media.",a:["keep track of"],h:"keep track of",ru:"Мне нравится следить за жизнью друзей через соцсети.",x:"Keep track of = to follow what is happening."},
{id:"c3",w:"c",t:"type",bank:"c",q:"I need to ___ the dean's office about my timetable.",a:["get in touch with"],h:"get in touch with",ru:"Мне нужно связаться с деканатом насчёт расписания.",x:"Get in touch with = to contact."},
{id:"c4",w:"c",t:"type",bank:"c",q:"Even after graduation, we ___ each other through a group chat.",a:["stay in touch with","keep in touch with"],h:"stay in touch with",ru:"Даже после выпуска мы на связи друг с другом через общий чат.",x:"Stay in touch with = to maintain a relationship with."},
{id:"c5",w:"c",t:"type",bank:"c",q:"When she moved to another city, we slowly ___ each other.",a:["lost touch with"],h:"lost touch with",ru:"Когда она переехала в другой город, мы постепенно потеряли связь.",x:"Lose touch with = to have no contact with; прошлое — lost."},
{id:"c6",w:"c",t:"type",bank:"c",q:"I ___ my old teacher at the cinema yesterday.",a:["bumped into","ran into"],h:"bumped into",ru:"Вчера в кино я случайно встретила свою старую учительницу.",x:"Bump into = to meet by accident; прошлое — bumped."},
{id:"c7",w:"c",t:"type",bank:"c",q:"Let's meet for coffee and ___ each other — I want to hear everything!",a:["catch up with"],h:"catch up with",ru:"Давай встретимся на кофе и расскажем друг другу новости — хочу знать всё!",x:"Catch up with = to exchange the latest news."},
{id:"c8",w:"c",t:"type",bank:"c",q:"It's important to ___ actively in a seminar, not just sit in silence.",a:["take part","participate"],h:"take part",ru:"Важно активно участвовать в семинаре, а не просто молчать.",x:"Take part / participate actively in a seminar."},
{id:"c9",w:"c",t:"type",bank:"c",q:"The media festival will ___ in the main hall on Friday.",a:["take place"],h:"take place",ru:"Медиафестиваль пройдёт в главном зале в пятницу.",x:"Take place — состояться, проходить."},
{id:"c10",w:"c",t:"type",bank:"c",q:"The courier ___ my new microphone two hours late.",a:["delivered"],h:"delivered",ru:"Курьер доставил мой новый микрофон с опозданием на два часа.",x:"Deliver — доставлять; delivery — доставка."},
{id:"c11",w:"c",t:"type",bank:"c",q:"She ___ to call him three times, but he didn't answer.",a:["attempted","tried"],h:"attempted",ru:"Она трижды пыталась ему дозвониться, но он не ответил.",x:"Attempt to do — пытаться; an attempt — попытка."},
{id:"c12",w:"c",t:"mc",q:"A recent ___ shows that students check their phones over 80 times a day.",o:["survey","surface","service"],a:"survey",ru:"Недавний опрос показывает, что студенты проверяют телефон больше 80 раз в день.",x:"Research / study / survey — исследование."},
{id:"c13",w:"c",t:"mc",src:1,q:"The internet has ___ communication.",o:["improved","proved","approved"],a:"improved",ru:"Интернет улучшил общение.",x:"Improve — улучшать; prove — доказывать."},
{id:"c14",w:"c",t:"mc",src:1,q:"There are some negative aspects of the internet in relation ___ communication.",o:["to","with","for"],a:"to",ru:"У интернета есть минусы применительно к общению.",x:"In relation to — применительно к."},
{id:"c15",w:"c",t:"mc",q:"Как сказать «выступить с презентацией»?",o:["make a presentation","say a presentation","tell a presentation"],a:"make a presentation",ru:"Make a presentation / a speech.",x:"С presentation и speech — make."},

{id:"c20",w:"c",t:"mc",src:1,q:"When the old man died, it was difficult to ___ down the relatives who should inherit his house.",o:["track","mark","keep","touch"],a:"track",ru:"Когда старик умер, было трудно разыскать родственников-наследников.",x:"Track down — разыскать."},
{id:"c21",w:"c",t:"mc",src:1,q:"I enjoy ___ up with my friends at the weekends. I love hearing what they've been doing.",o:["keeping","getting","catching","tracking"],a:"catching",ru:"Люблю по выходным болтать с друзьями и узнавать, как прошла их неделя.",x:"Catch up with — обменяться новостями."},

{id:"c25",w:"c",t:"type",src:1,q:"Should you have any problem contacting Sally, please do not ___ to contact me again.",a:["hesitate"],h:"hesitate",ru:"Если не получится связаться с Салли, без колебаний пишите мне снова.",x:"Please do not hesitate to — не стесняйтесь."},
{id:"c26",w:"c",t:"type",src:1,ctx:"The letter starts with «Dear Mr Jones».",q:"Yours ___, Ellen Matthews",a:["sincerely"],h:"sincerely",ru:"С уважением, Эллен Мэттьюз.",x:"Имя адресата известно → sincerely; Dear Sir or Madam → faithfully."},
{id:"c27",w:"c",t:"build",q:"Я потеряла связь со школьными друзьями.",a:"I have lost touch with my school friends.",alt:["I've lost touch with my school friends.","I lost touch with my school friends."],ru:"Я потеряла связь со школьными друзьями.",x:"Lose touch with."},
{id:"c28",w:"c",t:"build",q:"Давай встретимся и обменяемся новостями.",a:"Let's meet and catch up.",alt:["Let's meet up and catch up.","Let's meet and catch up with each other."],ru:"Давай встретимся и обменяемся новостями.",x:"Catch up — обменяться новостями."},
{id:"n1",w:"n",t:"type",src:1,say:1,q:"Communication through posture, movements and facial expressions rather than words.",a:["body language"],h:"body language",ru:"Общение позой, движениями и мимикой → язык тела.",x:"b___ l___ — body language."},
{id:"n2",w:"n",t:"type",src:1,say:1,q:"Looking directly into another person's eyes while talking.",a:["eye contact"],h:"eye contact",ru:"Смотреть собеседнику в глаза → зрительный контакт.",x:"e___ c___ — eye contact."},
{id:"n3",w:"n",t:"type",src:1,say:1,q:"The area around you that you don't want strangers to enter.",a:["personal space"],h:"personal space",ru:"Зона вокруг тебя, куда не хочется пускать чужих → личное пространство.",x:"p___ s___ — personal space."},
{id:"n4",w:"n",t:"type",src:1,say:1,q:"To bend your head or body forward to greet someone or show respect.",a:["bow"],h:"bow",ru:"Наклонить голову или корпус в знак приветствия → поклониться.",x:"b___ — bow."},
{id:"n5",w:"n",t:"type",src:1,say:1,q:"To move your hand from side to side to say hello or goodbye.",a:["wave"],h:"wave",ru:"Двигать рукой туда-сюда, здороваясь или прощаясь → помахать.",x:"w___ — wave."},
{id:"n6",w:"n",t:"type",src:1,say:1,q:"To take someone's hand and move it up and down when you meet.",a:["shake hands"],h:"shake hands",ru:"Взять руку человека и пожать при встрече → пожать руки.",x:"s___ h___ — shake hands."},
{id:"n7",w:"n",t:"type",src:1,say:1,q:"Complete absence of sound or speech.",a:["silence"],h:"silence",ru:"Полное отсутствие звука → тишина.",x:"s___ — silence."},
{id:"n8",w:"n",t:"type",src:1,say:1,q:"A person who studies how people behave in groups and in society.",a:["sociologist"],h:"sociologist",ru:"Человек, который изучает поведение людей в обществе → социолог.",x:"s___ — sociologist."},
{id:"n9",w:"n",t:"type",bank:"n",q:"Standing too close to a stranger means you ___ their personal space.",a:["invade"],h:"invade",ru:"Встать слишком близко к незнакомцу — значит вторгнуться в его личное пространство.",x:"Invade one's personal space."},
{id:"n10",w:"n",t:"type",src:1,bank:"n",q:"In some cultures it's better to ___ some gestures, as they can offend people.",a:["avoid"],h:"avoid",ru:"В некоторых культурах лучше избегать определённых жестов — они могут обидеть.",x:"Avoid some gestures."},
{id:"n11",w:"n",t:"type",src:1,bank:"n",q:"Age and gender make a ___.",a:["difference"],h:"difference",ru:"Возраст и пол имеют значение.",x:"Make a difference — иметь значение."},
{id:"n12",w:"n",t:"type",src:1,bank:"n",q:"There is a list of the most important things to ___ when communicating with different people.",a:["consider"],h:"consider",ru:"Есть список самых важных вещей, которые стоит учитывать в общении с разными людьми.",x:"Consider — учитывать."},
{id:"n13",w:"n",t:"type",src:1,bank:"n",q:"The theory says there are only six degrees of ___ between any two people.",a:["separation"],h:"separation",ru:"Теория гласит, что любых двух людей разделяет всего шесть рукопожатий.",x:"Separate → separation."},
{id:"n14",w:"n",t:"mc",src:1,q:"Teenagers are easily influenced ___ their friends.",o:["by","on","from"],a:"by",ru:"На подростков легко влияют друзья.",x:"Be influenced by."},
{id:"n15",w:"n",t:"mc",src:1,q:"Bloggers have a strong influence ___ teenagers.",o:["on","to","at"],a:"on",ru:"Блогеры сильно влияют на подростков.",x:"Have an influence on."},
{id:"n16",w:"n",t:"mc",src:1,q:"She is one of the most ___ people in the media industry.",o:["influential","influenced","influence"],a:"influential",ru:"Она одна из самых влиятельных людей в медиа.",x:"Influential — влиятельный."},
{id:"n17",w:"n",t:"type",src:1,bank:"n",q:"The sociologist chose a sample of people at ___ for the experiment.",a:["random"],h:"random",ru:"Социолог выбрал группу людей для эксперимента наугад.",x:"Choose at random — выбрать наугад."},
{id:"n18",w:"n",t:"type",src:1,bank:"n",q:"The experiment involves 10 participants whose ___ age is 18 years old.",a:["average"],h:"average",ru:"В эксперименте 10 участников, их средний возраст — 18 лет.",x:"Average age — средний возраст."},
{id:"n19",w:"n",t:"type",src:1,bank:"n",q:"The researchers decided to ___ the experiment on the internet.",a:["recreate","replicate"],h:"recreate",ru:"Исследователи решили воссоздать эксперимент в интернете.",x:"Recreate the experiment on the internet."},
{id:"n20",w:"n",t:"type",src:1,bank:"n",q:"Scientists want to ___ the theory with a new experiment.",a:["prove"],h:"prove",ru:"Учёные хотят доказать теорию новым экспериментом.",x:"Prove the theory — доказать теорию."},
{id:"n21",w:"n",t:"mc",src:1,q:"Don't judge people by their ___.",o:["appearance","appear","appearing"],a:"appearance",ru:"Не суди людей по внешности.",x:"Appear → appearance; judge by appearance."},
{id:"n22",w:"n",t:"mc",src:1,q:"I ___ why she never answers my messages.",o:["wonder","wander","wondering"],a:"wonder",ru:"Интересно, почему она никогда не отвечает на мои сообщения.",x:"Wonder — задаваться вопросом; wander — бродить."},
{id:"n23",w:"n",t:"type",src:1,bank:"n",q:"Her speech was so ___ that I wrote my own script that night. (INSPIRE)",a:["inspiring"],h:"inspiring",ru:"Её речь так вдохновляла, что в ту же ночь я написала свой сценарий.",x:"-ing — о том, что вдохновляет."},
{id:"n24",w:"n",t:"type",src:1,bank:"n",q:"I felt really ___ after the masterclass. (INSPIRE)",a:["inspired"],h:"inspired",ru:"После мастер-класса я была очень вдохновлена.",x:"-ed — о том, кого вдохновили."},
{id:"n25",w:"n",t:"mc",src:1,q:"The video was made for a ___ audience of students aged 17–20.",o:["target","goal","aim"],a:"target",ru:"Видео сделано для целевой аудитории студентов 17–20 лет.",x:"Target audience — целевая аудитория."},
{id:"n26",w:"n",t:"mc",src:1,ctx:"Saying the wrong thing in the wrong way can upset people, and they may stop trusting and respecting you.",q:"You can lose people's respect if you communicate poorly.",o:["верно по тексту","не следует из текста"],a:"верно по тексту",ru:"Если плохо общаться, можно потерять уважение людей.",x:"Stop respecting = lose respect."},
{id:"n27",w:"n",t:"mc",src:1,ctx:"When people's feelings are hurt, they respond negatively.",q:"People can react in a bad way if a message is communicated ineffectively.",o:["верно по тексту","не следует из текста"],a:"верно по тексту",ru:"Люди могут плохо отреагировать, если сообщение подано неудачно.",x:"Respond negatively = react in a bad way."},
{id:"n28",w:"n",t:"mc",src:1,ctx:"Poor communication can lead to disastrous results both at work and in the home.",q:"Bad communication is most commonly seen at work.",o:["верно по тексту","не следует из текста"],a:"не следует из текста",ru:"Плохое общение чаще всего встречается на работе.",x:"В тексте: и на работе, и дома. Где чаще — не сказано."},
{id:"n29",w:"n",t:"mc",src:1,ctx:"Listening is one area of communication in which most people fail.",q:"Many people are unable to listen effectively.",o:["верно по тексту","не следует из текста"],a:"верно по тексту",ru:"Многие не умеют по-настоящему слушать.",x:"Most people fail = many are unable."},
{id:"n30",w:"n",t:"mc",src:1,ctx:"First of all, try to see the discussion from the other person's perspective.",q:"You should make sure people understand your point of view.",o:["верно по тексту","не следует из текста"],a:"не следует из текста",ru:"Нужно убедиться, что люди понимают твою точку зрения.",x:"Наоборот: понять точку зрения другого."},
{id:"n31",w:"n",t:"mc",src:1,ctx:"Many of us are too quick to interrupt the speaker.",q:"You should interrupt quickly and politely during a discussion.",o:["верно по тексту","не следует из текста"],a:"не следует из текста",ru:"В разговоре нужно перебивать быстро и вежливо.",x:"Too quick to interrupt — ошибка, а не совет."},
{id:"n32",w:"n",t:"mc",src:1,ctx:"While you are listening, look at the other person and notice their non-verbal behaviour.",q:"Use gestures to make your meaning clearer.",o:["верно по тексту","не следует из текста"],a:"не следует из текста",ru:"Используй жесты, чтобы яснее выразить мысль.",x:"Жесты надо замечать у собеседника, а не делать самой."},
{id:"n33",w:"n",t:"mc",src:1,ctx:"While you are listening, look at the other person and notice their non-verbal behaviour.",q:"You should observe how the other people react non-verbally.",o:["верно по тексту","не следует из текста"],a:"верно по тексту",ru:"Нужно наблюдать, как собеседник реагирует без слов.",x:"Notice non-verbal behaviour = observe."},
{id:"n34",w:"n",t:"mc",src:1,ctx:"The way people sit, stand and move can show that they are uncomfortable or not telling the truth.",q:"It's possible to recognise if someone is lying by watching the way they act.",o:["верно по тексту","не следует из текста"],a:"верно по тексту",ru:"По поведению можно понять, что человек врёт.",x:"Not telling the truth = lying."},
{id:"n35",w:"n",t:"mc",src:1,ctx:"Appreciating that someone is giving you their time and attention is extremely important.",q:"Other people's opinions are formed by the way you speak to them.",o:["верно по тексту","не следует из текста"],a:"не следует из текста",ru:"Мнение людей складывается из того, как ты с ними говоришь.",x:"Про формирование мнений в тексте ничего нет."},
{id:"n36",w:"n",t:"build",q:"Не суди по внешности.",a:"Don't judge by appearance.",alt:["Do not judge by appearance.","Don't judge people by appearance.","Don't judge people by their appearance."],ru:"Не суди по внешности.",x:"Judge by appearance."},
{id:"n37",w:"n",t:"build",q:"Зрительный контакт очень важен.",a:"Eye contact is very important.",ru:"Зрительный контакт очень важен.",x:"Eye contact — без артикля."},
{id:"u1",w:"u",t:"type",src:1,bank:"u",q:"During a debate, try to ___ of your emotions and voice.",a:["remain in control","stay in control"],h:"remain in control",ru:"Во время дебатов старайся держать под контролем эмоции и голос.",x:"Remain in control of emotions and voice."},
{id:"u2",w:"u",t:"type",src:1,bank:"u",q:"Stand straight and ___ good posture.",a:["maintain","keep"],h:"maintain",ru:"Стой прямо и держи осанку.",x:"Maintain good posture."},
{id:"u3",w:"u",t:"type",src:1,bank:"u",q:"Smile and look people in the eye to make a good first ___.",a:["impression"],h:"impression",ru:"Улыбайся и смотри в глаза, чтобы произвести хорошее первое впечатление.",x:"Make a good first impression."},
{id:"u4",w:"u",t:"type",src:1,bank:"u",q:"Communicate in an ___, not an aggressive style.",a:["assertive"],h:"assertive",ru:"Общайся уверенно, но не агрессивно.",x:"Assertive — уверенный и твёрдый без агрессии."},
{id:"u5",w:"u",t:"type",src:1,bank:"u",q:"Even when people are rude, try to stay calm and ___.",a:["polite"],h:"polite",ru:"Даже если грубят, старайся оставаться спокойной и вежливой.",x:"Stay calm and polite."},
{id:"u6",w:"u",t:"type",src:1,bank:"u",q:"A good host is also a good ___.",a:["listener"],h:"listener",ru:"Хороший ведущий — это ещё и хороший слушатель.",x:"Be a good listener."},
{id:"u7",w:"u",t:"type",src:1,bank:"u",q:"My voice ___ under pressure, so I practise before every speech.",a:["cracks"],h:"cracks",ru:"Под давлением у меня срывается голос, поэтому я репетирую каждую речь.",x:"Voice cracks under pressure; my voice → -s."},
{id:"u8",w:"u",t:"type",src:1,bank:"u",q:"Your hands can give ___ your emotions, so keep them still.",a:["away"],h:"away",ru:"Руки могут выдать твои эмоции, так что держи их спокойно.",x:"Give away emotions — выдать эмоции."},
{id:"u9",w:"u",t:"type",src:1,bank:"u",q:"A speech ___ doesn't stop him from being a great speaker.",a:["impediment"],h:"impediment",ru:"Дефект речи не мешает ему быть отличным оратором.",x:"Speech impediment — дефект речи."},
{id:"u10",w:"u",t:"type",src:1,bank:"u",q:"Be ___ of cultural differences when you talk to foreign guests.",a:["aware"],h:"aware",ru:"Учитывай культурные различия, когда говоришь с иностранными гостями.",x:"Be aware of — осознавать."},
{id:"u11",w:"u",t:"type",src:1,bank:"u",q:"To ___ successfully with clients, you need to listen to them.",a:["interact"],h:"interact",ru:"Чтобы успешно взаимодействовать с клиентами, нужно их слушать.",x:"Interact successfully with smb."},
{id:"u12",w:"u",t:"type",src:1,bank:"u",q:"Good speakers ___ people with interest and excitement.",a:["engage"],h:"engage",ru:"Хорошие спикеры увлекают людей интересом и азартом.",x:"Engage people — вовлекать."},
{id:"u13",w:"u",t:"type",src:1,bank:"u",q:"His constant jokes during the lecture were really ___. (IRRITATE)",a:["irritating"],h:"irritating",ru:"Его бесконечные шутки на лекции реально раздражали.",x:"-ing — то, что раздражает."},
{id:"u14",w:"u",t:"type",src:1,bank:"u",q:"I felt ___ when the bus was late again. (IRRITATE)",a:["irritated"],h:"irritated",ru:"Я разозлилась, когда автобус снова опоздал.",x:"-ed — человек раздражён."},
{id:"u15",w:"u",t:"type",src:1,q:"Shyness is the main reason ___ her silence at seminars.",a:["for"],h:"for",ru:"Застенчивость — главная причина её молчания на семинарах.",x:"The main reason for smth."},
{id:"u16",w:"u",t:"type",src:1,q:"She made an effort ___ remember everyone's name.",a:["to"],h:"to",ru:"Она постаралась запомнить имена всех.",x:"Make an effort to do smth."},
{id:"u17",w:"u",t:"type",src:1,q:"He has a lack of confidence ___ himself.",a:["in"],h:"in",ru:"Ему не хватает уверенности в себе.",x:"A lack of confidence in."},
{id:"u18",w:"u",t:"type",src:1,q:"Before the speech, consider your potential ___ — who will be in the room?",a:["listeners","audience"],h:"listeners",ru:"Перед речью подумай о будущих слушателях — кто будет в зале?",x:"Consider potential listeners."},
{id:"u19",w:"u",t:"mc",src:1,q:"She can speak ___ in front of a big audience.",o:["confidently","confident","confidence"],a:"confidently",ru:"Она умеет уверенно говорить перед большой аудиторией.",x:"После глагола — наречие на -ly."},
{id:"u20",w:"u",t:"mc",src:1,q:"She looks ___ on camera.",o:["confident","confidently","confidence"],a:"confident",ru:"В кадре она выглядит уверенно.",x:"Look + прилагательное."},
{id:"u21",w:"u",t:"mc",src:1,q:"The way we communicate is changing ___.",o:["rapidly","rapid","rapidity"],a:"rapidly",ru:"То, как мы общаемся, быстро меняется.",x:"Change rapidly / dramatically / constantly / frequently."},
{id:"u22",w:"u",t:"mc",src:1,q:"Misunderstandings occur ___ in online chats.",o:["frequently","frequent","frequency"],a:"frequently",ru:"В онлайн-чатах часто случаются недопонимания.",x:"Occur frequently."},
{id:"u23",w:"u",t:"mc",src:1,q:"The number of social media users has increased ___ over the last ten years.",o:["dramatically","dramatic","drama"],a:"dramatically",ru:"За десять лет число пользователей соцсетей резко выросло.",x:"Increase dramatically / rapidly / constantly."},
{id:"u24",w:"u",t:"mc",src:1,q:"People behave ___ in a group and alone.",o:["differently","different","difference"],a:"differently",ru:"В группе и наедине люди ведут себя по-разному.",x:"Behave differently."},
{id:"u25",w:"u",t:"mc",q:"Чем impress отличается от impression?",o:["impress — глагол «впечатлить», impression — «впечатление»","impress — «впечатление», impression — глагол","ничем"],a:"impress — глагол «впечатлить», impression — «впечатление»",ru:"Impress the audience — впечатлить зал; make an impression — произвести впечатление.",x:"-ion делает существительное."},
{id:"u26",w:"u",t:"build",q:"Будь собой.",a:"Be yourself.",ru:"Будь собой.",x:"Be yourself."},
{id:"u27",w:"u",t:"build",q:"Я стараюсь сохранять спокойствие.",a:"I try to stay calm.",alt:["I'm trying to stay calm.","I am trying to stay calm.","I try to remain calm."],ru:"Я стараюсь сохранять спокойствие.",x:"Stay calm."},
{id:"u28",w:"u",t:"build",q:"Очень важно произвести хорошее первое впечатление.",a:"It is very important to make a good first impression.",alt:["It's very important to make a good first impression.","Making a good first impression is very important."],ru:"Очень важно произвести хорошее первое впечатление.",x:"Make a good first impression."},
{id:"g1",w:"g",t:"type",src:1,q:"Men and women communicate ___. (DIFFERENT)",a:["differently"],h:"differently",ru:"Мужчины и женщины общаются по-разному.",x:"После глагола — наречие на -ly."},
{id:"g2",w:"g",t:"type",src:1,q:"Age, gender and culture are the factors that can influence a ___ style. (CONVERSATION)",a:["conversational"],h:"conversational",ru:"Возраст, пол и культура влияют на манеру разговора.",x:"Conversation → conversational."},
{id:"g3",w:"g",t:"type",src:1,bank:"g",q:"It's rude to ___ people when they are speaking.",a:["interrupt"],h:"interrupt",ru:"Невежливо перебивать людей, когда они говорят.",x:"Interrupt — перебивать."},
{id:"g4",w:"g",t:"type",src:1,q:"People who live in ___ areas often travel to the city centre for work. (SUBURB)",a:["suburban"],h:"suburban",ru:"Жители пригородов часто ездят на работу в центр.",x:"Suburb → suburban."},
{id:"g5",w:"g",t:"type",src:1,bank:"g",q:"My little sister is particularly ___ in the morning — she never stops chatting.",a:["talkative"],h:"talkative",ru:"Моя младшая сестра особенно болтлива по утрам.",x:"Be particularly talkative."},
{id:"g6",w:"g",t:"type",src:1,bank:"g",q:"His speech was full of ___ comments and explanations.",a:["lengthy"],h:"lengthy",ru:"Его речь была полна затянутых комментариев и объяснений.",x:"Length → lengthy — затянутый."},
{id:"g7",w:"g",t:"type",src:1,bank:"g",q:"Our neighbours often ___ about the noise.",a:["complain"],h:"complain",ru:"Соседи часто жалуются на шум.",x:"Complain about smth."},
{id:"g8",w:"g",t:"type",src:1,bank:"g",q:"We received a ___ about the sound quality of the video.",a:["complaint"],h:"complaint",ru:"Нам пришла жалоба на качество звука в видео.",x:"Complain → complaint."},
{id:"g9",w:"g",t:"type",src:1,bank:"g",q:"When he told the joke, everyone burst into ___.",a:["laughter"],h:"laughter",ru:"Когда он пошутил, все расхохотались.",x:"Burst into laughter."},
{id:"g10",w:"g",t:"type",src:1,bank:"g",q:"She looked ___ and hurt when nobody answered her question.",a:["puzzled"],h:"puzzled",ru:"Когда ей никто не ответил, она выглядела озадаченной и обиженной.",x:"Look puzzled and hurt."},
{id:"g11",w:"g",t:"type",src:1,bank:"g",q:"He tells the best stories — he's always the life of the ___.",a:["party"],h:"party",ru:"Он лучше всех рассказывает истории — всегда душа компании.",x:"The life of the party."},
{id:"g12",w:"g",t:"type",src:1,bank:"g",q:"Use anecdotes, questions and direct speech to ___ the interest of the audience.",a:["raise"],h:"raise",ru:"Используй истории, вопросы и прямую речь, чтобы вызвать интерес зала.",x:"Raise interest."},
{id:"g13",w:"g",t:"type",src:1,bank:"g",q:"Through storytelling and joking, he always holds centre ___.",a:["stage"],h:"stage",ru:"Рассказами и шутками он всегда в центре внимания.",x:"Hold centre stage."},
{id:"g14",w:"g",t:"type",src:1,bank:"g",q:"I ___ agree with you — it's a great idea!",a:["heartily"],h:"heartily",ru:"Я горячо с тобой согласна — отличная идея!",x:"Heartily agree."},
{id:"g15",w:"g",t:"type",src:1,bank:"g",q:"Every student, without ___, passed the test.",a:["exception"],h:"exception",ru:"Все студенты без исключения сдали тест.",x:"Without exception."},
{id:"g16",w:"g",t:"type",src:1,bank:"g",q:"I always ___ my lectures on my phone.",a:["record"],h:"record",ru:"Я всегда записываю лекции на телефон.",x:"Record — записывать."},

show(back("home","главная")+'<div class="stack" style="gap:16px"><h2>Сохранение</h2>'+(msg?'<div class="warn">'+esc(msg)+"</div>":"")+'<p class="soft">Прогресс сохраняется сам после каждого ответа, сразу в два хранилища браузера. Сейчас в нём '+n+' фраз.</p><div class="list"><div><b>1. Добавь на экран «Домой»</b><span>'+(app2?"Уже сделано — ты сейчас в режиме приложения.":"Safari → кнопка «Поделиться» → «На экран Домой». Так сайт работает как приложение, и Safari не стирает его данные, пока ты им пользуешься.")+'</span></div><div><b>2. Код сохранения</b><span>Скопируй и положи в заметки. Вставишь на любом устройстве — прогресс вернётся.</span></div></div><textarea class="code" id="mycode" readonly>'+code()+'</textarea><div class="row"><button class="btn go" data-cmd="copy">Скопировать код</button><button class="btn" data-cmd="dl">Скачать файлом</button></div><div class="lab" style="margin-top:10px">вернуть прогресс</div><textarea class="code" id="incode" placeholder="вставь код сюда"></textarea><div class="row"><button class="btn" data-cmd="restore">Вернуть из кода</button><label class="btn thin" for="file">Открыть файл</label><input type="file" id="file" accept=".txt,text/plain" hidden></div><p class="dim" style="font-size:13.5px">При возврате ничего не теряется: из двух версий каждой фразы остаётся более свежая.</p></div>',"save");
var f=document.getElementById("file");if(f)f.addEventListener("change",function(){var fl=f.files&&f.files[0];if(!fl)return;var rd=new FileReader();rd.onload=function(){var r=uncode(rd.result);saveView(r?"Прогресс возвращён.":"Файл не подошёл.")};rd.readAsText(fl)})}
function about(){stop();var t="keep track of";show(back("home","главная")+'<div class="stack" style="gap:14px"><h2>Как это устроено</h2><div class="list"><div><b>Как фраза рассыпается</b><span class="noise">'+esc(t)+" → "+erode(t,.35,hash(t))+" → "+erode(t,.7,hash(t))+'</span><em>После верного ответа фраза снова чистая.</em></div>'+MODES.map(function(m){return"<div><b>"+m[0]+"</b><span>"+m[1]+"</span><em>"+m[2]+"</em></div>"}).join("")+'</div><div class="lab" style="margin-top:12px">думать по-английски</div><p class="soft">Внутренняя речь на втором языке растёт вместе с практикой вслух. Три привычки на день: проговаривай свои действия в Present Continuous («I\'m opening my laptop»); вечером перескажи день пятью фразами в прошедших временах; вместо «блин, забыла» — «I\'ve forgotten».</p><div class="lab" style="margin-top:12px">исследования</div><ol class="src">'+SRC.map(function(s){return'<li><a href="'+s[1]+'" target="_blank" rel="noopener">'+esc(s[0])+"</a></li>"}).join("")+"</ol></div>","about")}
function route(r){var p=r.split(":");if(p[0]==="home")home();else if(p[0]==="sec")section(p[1]);else if(p[0]==="learn")learn(p[1]);else if(p[0]==="learnx")learn(p[1],true);else if(p[0]==="talk"){if(p[1]!=null)talkOpen(+p[1]);else talks()}else if(p[0]==="save")saveView();else if(p[0]==="about")about()}
app.addEventListener("click",function(e){var b=e.target.closest("button,.kw,[data-hide],label");if(!b)return;
if(b.hasAttribute("data-hide")){b.textContent=b.getAttribute("data-hide");b.removeAttribute("data-hide");return}
if(b.classList.contains("kw")){if(b.classList.toggle("open"))b.textContent=b.getAttribute("data-kw");else b.innerHTML=erode(b.getAttribute("data-kw"),+b.getAttribute("data-e"),+b.getAttribute("data-s"));return}
var g=b.getAttribute("data-go");if(g){route(g);return}
if(b.hasAttribute("data-say")){say(b.getAttribute("data-say"));return}
if(b.id==="dial"){dial();return}
if(b.hasAttribute("data-cutk")){submit(b.getAttribute("data-cutk"));return}
if(b.hasAttribute("data-chip")){var k=b.getAttribute("data-chip");if(talk.used[k])delete talk.used[k];else talk.used[k]=1;b.classList.toggle("on");return}
var c=b.getAttribute("data-cmd"),w=b.getAttribute("data-w")||null;
if(c==="clean")start("clean");else if(c==="final")start("final");else if(c==="cold")start("cold",w);else if(c==="drill")start(w?"drill":"clean",w);
else if(c==="ok")submit();else if(c==="hint")hint();
else if(c==="jsay")say(JINGLES[w].join(" ").replace(/[\[\]]/g,""));
else if(c==="jup"){S.jg[w]=Math.min(3,(S.jg[w]||0)+1);save();learn(w);setTimeout(function(){var j=document.querySelector(".jing");if(j)j.scrollIntoView({block:"start"})},30)}
else if(c==="jreset"){S.jg[w]=0;save();learn(w)}
else if(c==="tgo")tgo();else if(c==="tsay")say(TALKS[talk.i].en);
else if(c==="copy"){var ta=document.getElementById("mycode");var done=function(){S.bk=Date.now();save();b.textContent="Скопировано"};try{navigator.clipboard.writeText(ta.value).then(done,function(){ta.select();done()})}catch(x){ta.select();done()}}
else if(c==="dl"){try{var bl=new Blob([code()],{type:"text/plain"}),a=document.createElement("a");a.href=URL.createObjectURL(bl);a.download="pomekhi-u1voc-"+new Date().toISOString().slice(0,10)+".txt";document.body.appendChild(a);a.click();a.remove();S.bk=Date.now();save()}catch(x){}}
else if(c==="restore"){var r=uncode(document.getElementById("incode").value);saveView(r?"Прогресс возвращён.":"Код не подошёл. Проверь, что скопирован целиком.")}});
boot();
</script>
